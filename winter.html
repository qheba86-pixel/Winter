<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>winter | ملابس الشتاء</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@1,600&family=Lalezar&family=Tajawal:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--ink:#4a2c1d;--red:#b3202e;--flake:#a9cbe6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:#fff;color:var(--ink);font-family:'Tajawal',sans-serif;font-size:18px;line-height:1.7;overflow-x:hidden;min-height:100vh}
.snow{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.snow svg{position:absolute;top:-30px;color:var(--flake);animation:fall linear infinite}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--rot))}}
header,main,footer{position:relative;z-index:1;max-width:1050px;margin:0 auto;padding:0 20px}
header{display:flex;justify-content:space-between;align-items:center;padding-top:22px}
.logo{font-family:'Fraunces',serif;font-style:italic;font-size:2.2rem;color:var(--red);direction:ltr}
nav{display:flex;gap:22px}
nav a{color:var(--ink);text-decoration:none;font-weight:500}
nav a:hover,nav a:focus-visible{color:var(--red);outline:none;text-decoration:underline}
.hero{display:grid;grid-template-columns:1.1fr 1fr;align-items:center;gap:20px;padding:40px 0 30px}
h1{font-family:'Lalezar',sans-serif;font-weight:400;font-size:clamp(2.6rem,7vw,4.6rem);line-height:1.15;margin:0 0 12px}
.hero p{max-width:30ch;margin:0 0 24px}
.btn{display:inline-block;background:var(--red);color:#fff;padding:12px 30px;border-radius:40px;text-decoration:none;font-weight:500}
.btn:hover,.btn:focus-visible{background:#8f1824;outline:3px solid #f2c9cd}
.scene{position:relative;display:flex;justify-content:center;padding:30px 0}
.mug{width:min(380px,85%);height:auto;overflow:visible}
.steam path{fill:none;stroke:#c9d9e6;stroke-width:6;stroke-linecap:round;opacity:0;animation:steam 4s ease-in-out infinite}
.steam path:nth-child(2){animation-delay:1.3s}.steam path:nth-child(3){animation-delay:2.6s}
@keyframes steam{0%{opacity:0;transform:translateY(12px)}40%{opacity:.9}100%{opacity:0;transform:translateY(-26px)}}
.deco{position:absolute;pointer-events:none;animation:bob 6s ease-in-out infinite}
.d1{width:62px;top:0;left:0;rotate:-18deg}
.d2{width:66px;top:46%;right:-4%;animation-delay:1s}
.d3{width:64px;top:2%;right:0;animation-delay:2s}
.d4{width:60px;bottom:0;right:2%;rotate:22deg;animation-delay:3s}
.d5{width:52px;top:22%;left:-6%;animation-delay:1.6s}
@keyframes bob{50%{transform:translateY(-10px)}}
h2{font-family:'Lalezar',sans-serif;font-weight:400;font-size:2rem;margin:30px 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px}
.card{background:#fff;border-radius:22px;padding:14px 14px 18px;border:2px solid #f3dfe0}
.card .pic{height:160px;border-radius:16px;display:grid;place-items:center;font-size:4.4rem;margin-bottom:10px}
.card h3{margin:0;font-size:1.1rem}
.card span{color:var(--red);font-weight:500}
footer{text-align:center;padding:50px 20px 40px}
.row{display:flex;justify-content:center;align-items:flex-end;gap:14px;margin-bottom:10px}
.row svg{height:70px;width:auto}
footer .stripe{height:14px;margin:0 auto 18px;max-width:420px;border-radius:8px;background:repeating-linear-gradient(135deg,var(--red) 0 14px,#fff 14px 28px);border:2px solid var(--red)}
.scene{cursor:pointer}.scene:focus-visible{outline:3px solid #f2c9cd;border-radius:24px}
.mug{position:relative;top:0;animation:drop 1.1s cubic-bezier(.3,1.5,.5,1) both,float 5s ease-in-out 1.3s infinite}
@keyframes drop{0%{transform:translateY(-140px) scale(.9,1.1);opacity:0}55%{opacity:1}78%{transform:translateY(0) scale(1.08,.92)}100%{transform:none}}
@keyframes float{50%{top:-7px}}
.mugbody{transform-box:view-box;transform-origin:150px 270px}
.m1,.m2,.m3{transform-box:fill-box;transform-origin:center;animation:marsh 3s ease-in-out infinite}
.m2{animation-delay:-1s}.m3{animation-delay:-2s}
@keyframes marsh{50%{transform:translateY(-4px) rotate(6deg)}}
.canemug{transform-box:view-box;transform-origin:185px 100px;animation:sway 4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}
.cheer .mugbody{animation:jiggle .7s ease}
@keyframes jiggle{20%{transform:rotate(-6deg)}40%{transform:rotate(5deg)}60%{transform:rotate(-3deg)}80%{transform:rotate(2deg)}}
.bear{position:absolute;left:-2%;bottom:-2%;width:150px;height:auto;overflow:visible;animation:peek .9s cubic-bezier(.3,1.5,.5,1) .9s both}
@keyframes peek{from{transform:translateY(70px) scale(.7);opacity:0}to{transform:none;opacity:1}}
.breath{transform-box:view-box;transform-origin:70px 168px;animation:breath 3.5s ease-in-out infinite}
@keyframes breath{50%{transform:scale(1.02,1.03)}}
.head{transform-box:view-box;transform-origin:70px 100px;animation:tilt 5s ease-in-out infinite}
@keyframes tilt{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.wave{transform-box:view-box;transform-origin:104px 126px;animation:wave 1.6s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(8deg)}50%{transform:rotate(-22deg)}}
.tail{transform-box:view-box;transform-origin:91px 116px;animation:swayt 3s ease-in-out infinite}
@keyframes swayt{0%,100%{transform:rotate(6deg)}50%{transform:rotate(-8deg)}}
.pom{transform-box:fill-box;transform-origin:center;animation:pom 2s ease-in-out infinite}
@keyframes pom{50%{transform:translate(3px,3px)}}
.cheer .bearall{animation:hop .7s ease}
.cheer .wave{animation-duration:.4s}
@keyframes hop{30%{transform:translateY(-28px)}60%{transform:translateY(0)}80%{transform:translateY(-9px)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
header{flex-wrap:wrap;gap:12px}
.tools{display:flex;align-items:center;gap:8px;flex:1;justify-content:flex-end;min-width:250px}
.search{flex:1;max-width:260px}
.field,.search input{width:100%;font:inherit;padding:9px 16px;border:2px solid #f3dfe0;border-radius:24px;background:#fff;color:var(--ink)}
textarea.field{border-radius:18px}.field{margin-bottom:10px}
input:focus,textarea:focus,button:focus-visible{outline:3px solid #f2c9cd}
.hbtn{position:relative;font:inherit;border:2px solid #f3dfe0;background:#fff;border-radius:30px;padding:6px 14px;cursor:pointer;color:var(--ink)}
.hbtn:hover{border-color:var(--red)}
.badge{position:absolute;top:-9px;left:-7px;background:var(--red);color:#fff;border-radius:12px;font-size:.75rem;min-width:20px;line-height:20px;text-align:center}
.btn2{border:0;cursor:pointer;font:inherit;font-weight:500}
.ghost{background:none;border:0;color:var(--red);cursor:pointer;font:inherit;text-decoration:underline;padding:0}
a.card{display:block;color:inherit;text-decoration:none;transition:transform .2s,border-color .2s}
a.card:hover,a.card:focus-visible{transform:translateY(-4px);border-color:var(--red);outline:none}
.stars{color:#f0a500;letter-spacing:2px}.stars small{color:var(--ink);letter-spacing:0}
.cform{max-width:520px}#cmsg{color:var(--red);font-weight:500}
.pv{display:grid;grid-template-columns:1fr 1fr;gap:30px;padding:24px 0}
.pv .big{height:340px;border-radius:26px;display:grid;place-items:center;font-size:9rem}
.pv h1{font-size:2.3rem;margin:0}.price{color:var(--red);font-size:1.6rem;font-weight:500}
.sizes{display:flex;gap:8px;margin:12px 0 18px}
.sizes button,.rate button{font:inherit;border:2px solid #f3dfe0;background:#fff;border-radius:12px;padding:4px 14px;cursor:pointer;color:var(--ink)}
.sizes button.on{background:var(--red);border-color:var(--red);color:#fff}
.rate button{border:0;font-size:1.8rem;color:#ccc;padding:0 2px}.rate button.on{color:#f0a500}
.rev{border-bottom:1px solid #f3dfe0;padding:10px 0}
.ov{position:fixed;inset:0;background:#0006;z-index:60;display:none}.ov.open{display:block}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(380px,100%);background:#fff;z-index:70;padding:20px;transform:translateX(-105%);transition:transform .3s;display:flex;flex-direction:column;visibility:hidden}
.drawer.open{transform:none;visibility:visible}
.dh{display:flex;justify-content:space-between;align-items:center}.dh h2{margin:0}
#cbody{flex:1;overflow:auto}
.line{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #f3dfe0}
.le{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-size:1.7rem}
.qty{display:flex;align-items:center;gap:8px}.qty button{width:28px;height:28px;border-radius:50%;border:2px solid #f3dfe0;background:#fff;cursor:pointer;font:inherit;color:var(--ink)}
.total{display:flex;justify-content:space-between;font-weight:500;font-size:1.2rem;padding:12px 0}
.modal{position:fixed;inset:0;z-index:80;display:none;place-items:center;background:#0006;padding:20px}.modal.open{display:grid}
.mbox{background:#fff;border-radius:26px;padding:26px;width:min(400px,100%);text-align:center}
.mbox h2{margin:0 0 6px}.mbox .btn{width:100%;margin-top:4px}
@media (max-width:760px){.pv{grid-template-columns:1fr}.tools{min-width:100%}.search{max-width:none}}
.bell{position:absolute;left:50%;top:-4px;width:84px;margin-left:-42px;opacity:0;pointer-events:none;z-index:3;transform:scale(0)}
.bell.on{animation:bellin var(--dur,12s) ease forwards}
.bell.on .bsw{animation:swing .64s ease-in-out infinite alternate}
.bsw{transform-box:view-box;transform-origin:50px 10px}
@keyframes bellin{0%{opacity:0;transform:scale(0)}2%{opacity:1;transform:scale(1.15)}3.5%{transform:scale(1)}93%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateY(-10px) scale(1)}}
@keyframes swing{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.hint{position:absolute;left:50%;top:68%;z-index:4;pointer-events:none;color:#fff;font-size:1.35rem;font-weight:700;text-shadow:0 1px 5px #0005;white-space:nowrap;animation:hintp 1.6s ease-in-out infinite;transition:opacity .4s}
.hint.gone{opacity:0;animation:none;transform:translateX(-50%)}
@keyframes hintp{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.1)}}
@media (max-width:760px){.hero{grid-template-columns:1fr;text-align:center}.hero p{margin-inline:auto}nav{gap:14px}}
</style>
</head>
<body>
<div class="snow" id="snow" aria-hidden="true"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>

<g fill="#d01c30"><circle cx="30" cy="30" r="3"/><circle cx="50" cy="28" r="3"/><circle cx="40" cy="42" r="3"/><circle cx="29" cy="50" r="3"/><circle cx="52" cy="48" r="3"/></g>

</defs>
</svg>

<header>
  <div class="logo">winter</div>
  <nav><a href="#new">المنتجات</a><a href="#contact">تواصل معنا</a></nav>
  <div class="tools">
    <label class="search"><span class="sr">بحث</span><input id="q" type="search" placeholder="ابحث عن منتج..."></label>
    <button class="hbtn" id="acc">👤 دخول</button>
    <button class="hbtn" id="cartb" aria-label="السلة">🛒<span class="badge" id="cnt">0</span></button>
  </div>
</header>

<main>
  <div id="home">
  <section class="hero">
    <div>
      <h1>خليك دافي،<br>الشتا إلنا</h1>
      <p>معاطف وكنزات وشالات ناعمة، بتحسسك إنك قاعد بكاسة هوت شوكلت.</p>
      <a class="btn" href="#new">تسوّق الآن</a>
    </div>
    <div class="scene" tabindex="0" role="button" aria-label="اضغط على الدب والكاسة">
      <svg class="deco d1" viewBox="0 0 80 140"><use href="#cane" width="80" height="140"/></svg>
      <svg class="deco d2" viewBox="0 0 80 100"><use href="#ginger" width="80" height="100"/></svg>
      <svg class="deco d3" viewBox="0 0 80 80"><use href="#iced" width="80" height="80"/></svg>
      <svg class="deco d4" viewBox="0 0 80 140"><use href="#cane" width="80" height="140"/></svg>
      <svg class="deco d5" viewBox="0 0 80 80"><use href="#cookie" width="80" height="80"/></svg>
      <svg class="mug" viewBox="0 0 320 300" role="img" aria-label="كاسة هوت شوكلت مع مصاص كريسمس">
        <ellipse cx="150" cy="276" rx="120" ry="14" fill="#e8eef3"/>

        <path d="M54 100h192v102a62 62 0 0 1-62 62h-68a62 62 0 0 1-62-62z" fill="#c4202f" stroke="#8f1824" stroke-width="5"/>

        <ellipse cx="150" cy="100" rx="98" ry="22" fill="#fff" stroke="#8f1824" stroke-width="5"/>

  <section id="new"><h2>المنتجات</h2><div class="grid" id="grid"></div></section>

    <form id="cf" class="cform"><input class="field" name="n" placeholder="اسمك" required><input class="field" type="email" name="e" placeholder="إيميلك" required><textarea class="field" name="m" rows="4" placeholder="رسالتك" required></textarea><button class="btn btn2">إرسال</button><p id="cmsg" role="status"></p></form>

  </div>
  <div id="pv" hidden></div>
</main>
<footer>
  <div class="row" aria-hidden="true">

<script>
(function(){
  var mug=document.querySelector('.mug'),bell=document.getElementById('bell'),hint=document.getElementById('hint'),busy=false;
  var F={C:523.25,D:587.33,E:659.25,F:698.46,G:783.99},B=.32;
  var M=[['E',1],['E',1],['E',2],['E',1],['E',1],['E',2],['E',1],['G',1],['C',1.5],['D',.5],['E',4],
         ['F',1],['F',1],['F',1.5],['F',.5],['F',1],['E',1],['E',1],['E',.5],['E',.5],['G',1],['G',1],['F',1],['D',1],['C',4]];
  function play(){
    var A=window.AudioContext||window.webkitAudioContext;if(!A)return 0;
    var c=play.c||(play.c=new A());if(c.state==='suspended')c.resume();
    var t=c.currentTime+.05,total=0;
    M.forEach(function(n){
      var f=F[n[0]],d=n[1]*B,rg=Math.min(1.6,d+.9);
      [[1,.2],[2.01,.09],[3.02,.05],[4.2,.025]].forEach(function(p){
        var o=c.createOscillator(),g=c.createGain();
        o.type='sine';o.frequency.value=f*p[0];
        g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(p[1],t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+rg);
        o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+rg+.05);
      });
      t+=d;total+=d;
    });
    return total+1.6;
  }
  mug.addEventListener('click',function(){
    hint.classList.add('gone');
    if(busy)return;busy=true;
    var secs=3;try{secs=play()||3}catch(e){}
    bell.style.setProperty('--dur',secs+'s');
    bell.classList.remove('on');void bell.getBoundingClientRect();bell.classList.add('on');
    setTimeout(function(){bell.classList.remove('on');busy=false},secs*1000);
  });
})();
</script>
